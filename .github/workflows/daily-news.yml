name: Daily FMCG & IB News Ingestion

on:
  schedule:
    # Runs at 23:30 UTC every day (5:00 AM IST)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  ingest-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Daily Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FMCGDESK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Starting scraper with retry logic..."
          MAX_RETRIES=3
          ATTEMPT=0
          rm -f scraper.log || true
          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "Attempt $ATTEMPT of $MAX_RETRIES"
            if node scripts/fetchNews.mjs > scraper.log 2>&1; then
              echo "Scraper succeeded on attempt $ATTEMPT"
              exit 0
            else
              echo "Scraper failed on attempt $ATTEMPT. Retrying after backoff..."
              sleep $((ATTEMPT * 5))
            fi
          done
          echo "All attempts failed. Exiting with non-zero so workflow marks failure and logs can be uploaded."
          exit 1

      - name: Upload Scraper Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-scraper-logs
          path: scraper.log