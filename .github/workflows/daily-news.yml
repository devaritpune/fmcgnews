name: Daily FMCG & IB News Ingestion

on:
  schedule:
    # Runs at 23:30 UTC every day (5:00 AM IST)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  ingest-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Daily Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FMCGDESK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetchNews.mjs