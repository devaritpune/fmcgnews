name: 🚀 Daily FMCG Multi-Category News Scraper

on:
  schedule:
    # Runs at 23:30 UTC every day (5:00 AM IST)
    - cron: '30 23 * * *'
  workflow_dispatch:
    # Manual safety control: leave blank for full run, or enter a small number (for example 3).
    inputs:
      test_limit:
        description: 'Maximum SAVED bulletins to ingest (blank = full production run)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      test_limit:
        description: 'Maximum SAVED bulletins to ingest (blank = full production run)'
        required: false
        default: ''
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  scrape-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: FMCG News Scraper
    
    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          echo "Installing dependencies from requirements.txt..."
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          echo "Dependencies installed successfully ✅"

      - name: ✔️ Verify Environment Variables
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_FMCGDESK }}" ]; then
            echo "❌ ERROR: FIREBASE_SERVICE_ACCOUNT_FMCGDESK secret not set!"
            exit 1
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "⚠️ WARNING: GEMINI_API_KEY not set. Using fallback summaries."
          fi
          echo "✅ Environment variables verified"

      - name: 📰 Execute Daily Scraper (Multi-Category)
        id: scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FMCGDESK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_TEST_LIMIT: ${{ inputs.test_limit }}
          TZ: Asia/Kolkata
        run: |
          echo "🚀 Starting FMCG News Scraper at $(date)"
          if [ -n "${SCRAPER_TEST_LIMIT}" ]; then
            echo "🧪 Controlled test mode requested: maximum ${SCRAPER_TEST_LIMIT} SAVED bulletin(s)."
          else
            echo "🚀 Full production ingestion mode."
          fi
          echo "Scraping 8 FMCG categories across 14+ news outlets..."

          # Create the logfile at runtime; shell expressions do not execute in top-level YAML env.
          LOG_FILE="scraper_run_$(date +%Y%m%d_%H%M%S).log"
          echo "📝 Log file: ${LOG_FILE}"

          # Relevance gating can evaluate many candidates before accepting a bulletin.
          # Allow up to 40 minutes while preserving the job-level 45-minute safety limit.
          set +e
          set -o pipefail
          timeout 2400 python scraper.py 2>&1 | tee "${LOG_FILE}"
          SCRAPER_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          echo "📊 Scraper completed with exit code: $SCRAPER_EXIT_CODE"
          
          # Set output for subsequent steps
          echo "exit_code=$SCRAPER_EXIT_CODE" >> $GITHUB_OUTPUT
          echo "log_file=${LOG_FILE}" >> $GITHUB_OUTPUT
          
          if [ $SCRAPER_EXIT_CODE -eq 124 ]; then
            echo "⏱️ ERROR: Scraper timed out after 40 minutes"
            exit 1
          elif [ $SCRAPER_EXIT_CODE -ne 0 ]; then
            echo "❌ Scraper failed with exit code: $SCRAPER_EXIT_CODE"
            exit 1
          fi
          
          echo "✅ Scraper completed successfully"

      - name: 📊 Parse & Log Summary
        if: always()
        run: |
          echo "=== SCRAPER EXECUTION SUMMARY ==="
          LOG_FILE="${{ steps.scraper.outputs.log_file }}"

          if [ -n "${LOG_FILE}" ] && [ -f "${LOG_FILE}" ]; then
            echo "Log file: ${LOG_FILE}"
            echo ""
            echo "--- Key Metrics ---"
            grep -Ei "total|processed|skipped|saved|rejected|error" "${LOG_FILE}" || echo "No summary metrics found"
            echo ""
            echo "--- Last 20 lines of output ---"
            tail -n 20 "${LOG_FILE}" || true
          else
            echo "Log file not found: ${LOG_FILE}"
          fi

      - name: 📤 Upload Logs as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: scraper_run_*.log
          retention-days: 30
          if-no-files-found: warn

      - name: 🔔 Notify on Success
        if: steps.scraper.outcome == 'success'
        run: |
          echo "✅ Daily FMCG News Scraper ran successfully!"
          echo "Timestamp: $(date)"
          echo "Scraped 8 FMCG categories from 14+ news outlets"

      - name: 🚨 Notify on Failure
        if: steps.scraper.outcome == 'failure'
        run: |
          echo "❌ FMCG News Scraper failed!"
          echo "Exit code: ${{ steps.scraper.outputs.exit_code }}"
          echo "Please check the logs artifact for details."
          echo "Logs: ${{ steps.scraper.outputs.log_file }}"
          exit 1
