name: Daily FMCG & IB News Ingestion

on:
  schedule:
    # Runs at 23:30 UTC every day (5:00 AM IST)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  ingest-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FMCGDESK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Starting Python scraper..."
          python scraper.py > scraper.log 2>&1

      - name: Upload Scraper Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-scraper-logs
          path: scraper.log